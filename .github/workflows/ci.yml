name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Shared Go CI: test, vet, fmt, lint, govulncheck, replace check, and the
  # full-history gitleaks secret scan.
  ci:
    uses: infodancer/workflows/.github/workflows/go-ci.yml@v0

  # go-ci tests the current stable release only; this repo also supports the
  # previous one.
  oldstable:
    name: test (Go oldstable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: oldstable
          check-latest: true
      - run: go test -race -count=1 ./...
